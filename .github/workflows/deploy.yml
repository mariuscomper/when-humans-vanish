# Auto-deploy: every push to the main branch goes live on
# https://mariuscomper.uk/when-humans-vanish/ — no manual sync step.
# Needs two repo secrets: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers
# template) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to mariuscomper.uk

on:
  push:
    branches: ["claude/keen-cori-7z9c24"]
  workflow_dispatch:

concurrency:
  group: deploy-when-humans-vanish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Audit
        run: |
          node --check worker.js
          # Root-absolute asset refs would 404: the page lives in a subfolder.
          if grep -rEn '(src|href)="/|url\(/' index.html ro css js vendor; then
            echo "::error::root-absolute asset refs break subfolder hosting"
            exit 1
          fi
          # ro/index.html is generated; fail if it is stale
          node tools/build-ro.js
          git diff --exit-code -- ro/index.html || { echo "::error::ro/index.html is stale: run node tools/build-ro.js"; exit 1; }
          for f in index.html ro/index.html favicon.svg og.png robots.txt sitemap.xml css/style.css \
                   data/cities.json data/land-110m.json data/plants.json \
                   data/region-ro.json data/rivers-ro.json js/core.js js/i18n.js; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Assemble public/
        run: |
          mkdir -p public
          cp index.html favicon.svg og.png robots.txt sitemap.xml public/
          cp -r css data js vendor ro public/
          # Stamp every stylesheet/script URL with this release so browsers never mix
          # a new page with a cached old stylesheet (core.js passes the stamp on to data/).
          V="${GITHUB_SHA::10}"
          sed -E -i "s#((href|src)=\"(\.\./)?(css|js|vendor)/[^\"?]+)\"#\1?v=$V\"#g" public/index.html public/ro/index.html
          grep -q "css/style.css?v=$V" public/index.html && grep -q "js/core.js?v=$V" public/ro/index.html \
            || { echo "::error::asset versioning failed"; exit 1; }

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # v4 required: path-scoped asset routes + run_worker_first need it
          # (the action's default 3.x rejects both).
          wranglerVersion: "4.128.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var RELEASE_STAMP:github-${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://mariuscomper.uk/when-humans-vanish/ | grep -q 'When Humans Vanish' \
              && curl -sf https://mariuscomper.uk/when-humans-vanish/ro/ | grep -q 'lang="ro"' \
              && curl -sfo /dev/null https://mariuscomper.uk/when-humans-vanish/js/core.js \
              && curl -sfo /dev/null https://mariuscomper.uk/when-humans-vanish/data/plants.json; then
              echo "live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::smoke test failed after 2 minutes"
          exit 1
