# Deploys the static site to mariuscomper.uk/when-humans-vanish via the
# .github/workflows/deploy.yml Action. The Action assembles ./public from the
# repo-root site files (it excludes tools/, docs and itself), so this file and
# worker.js are never uploaded as assets.
name = "when-humans-vanish"
compatibility_date = "2026-09-07"
main = "./worker.js"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[routes]]
pattern = "mariuscomper.uk/when-humans-vanish*"
zone_name = "mariuscomper.uk"
